name: Update HK Market Breadth Data

on:
  schedule:
    # 每週一至五 08:15 UTC (= 香港時間 16:15 收市後) 自動執行
    - cron: '15 8 * * 1-5'
  workflow_dispatch: # 允許手動一鍵立即執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run breadth calculation
        run: python update_data.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update 2800.HK breadth data"
          git push
